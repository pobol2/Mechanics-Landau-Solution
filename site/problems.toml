# Descriptive titles of the problems, shown on the website. Each table is a
# problem ID (s<section>-p<problem>, from the book's numbering), with a title:
# what the problem is about, in a few words. Plain text: Unicode symbols
# (φ, ω, ²) are fine; an underscore makes a subscript (M_z). With its label
# ("§9 Problem 3: ") it is the page title in search results, so it has about
# 45 characters at most: the build stops on a title that does not fit.

