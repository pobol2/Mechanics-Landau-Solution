#
# Builds the manual (main.pdf, which is not tracked) with TeX Live, checks that
# the committed README progress matches it, then builds the website (the
# catalogue, a page per solved problem and one PDF per problem) from the fresh
# build/main.pdf and build/main-problems.json with the template's builder
# (template/solution-manual/site/build.py) and the settings of site/site.toml,
# and deploys it to GitHub Pages on each push to master.
# Pull requests and manual runs on other branches are built and checked, but
# not deployed.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Website

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the site URL
    steps:
      - uses: actions/checkout@v5

      # Only the template submodule is needed (the shared build rules and the
      # website builder): the manual reads the saved simulation data in
      # Figures/Data/, not physics-engine
      - name: Check out the template submodule
        id: template
        run: |
          git submodule update --init --depth 1 template
          echo "commit=$(git rev-parse HEAD:template)" >> "$GITHUB_OUTPUT"

      # Figures/*.pdf (LuaLaTeX, slow) from an earlier run with the same
      # figure sources and template
      - name: Restore the figures
        id: figures
        uses: actions/cache/restore@v4
        with:
          path: Figures/*.pdf
          key: figures-${{ steps.template.outputs.commit }}-${{ hashFiles('Figures/*.tex', 'myfigures.sty', 'SolutionFigure.lua', 'Figures/Data/**') }}

      # Without build/main.fdb_latexmk, latexmk rebuilds a figure older than
      # its source, and the checkout is newer than the restored PDFs
      - name: Mark the restored figures as up to date
        if: steps.figures.outputs.cache-hit == 'true'
        run: touch Figures/*.pdf

      # TeX Live image with pdfLaTeX, LuaLaTeX, latexmk and Perl. latexmk reads
      # ./latexmkrc, which writes build/main-problems.json, copies main.pdf to
      # the root and rewrites the Progress section of README.md.
      - name: Build the manual
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: main.tex
          # No -halt-on-error: missing Figures/*.pdf must not stop pdfLaTeX before latexmk builds them all
          args: -file-line-error -interaction=nonstopmode

      # Saved right away, so a stale README below does not lose the figures
      - name: Save the figures
        if: steps.figures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Figures/*.pdf
          key: ${{ steps.figures.outputs.cache-primary-key }}

      - name: Check that the README progress is up to date
        run: |
          if ! git diff --exit-code README.md; then
            echo "::error file=README.md::The Progress section of README.md does not match the manual: run latexmk and commit README.md"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: template/solution-manual/site/requirements.txt

      - run: python -m pip install -r template/solution-manual/site/requirements.txt

      - id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v5

      # From the root, which has site/site.toml. Fails, and deploys nothing,
      # when build/main.pdf and build/main-problems.json disagree, a title is
      # too long or a problem PDF or page does not check out. Without
      # deployment, the base URL is that of site.toml.
      - name: Build the website
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          python template/solution-manual/site/build.py
          --out _site --base-url "$BASE_URL"

      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
